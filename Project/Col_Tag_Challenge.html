<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Column Example</title>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1 style="text-align:center;">Student Information Table</h1>

<table>

    <!-- Column settings -->
    <colgroup>
        <col style="background-color: lightblue;">
        <col style="background-color: lightyellow;">
        <col style="background-color: lightgreen;">
    </colgroup>

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
    </tr>

    <tr>
        <td>Kyla</td>
        <td>16</td>
        <td>10</td>
    </tr>

    <tr>
        <td>Rex</td>
        <td>18</td>
        <td>12</td>
    </tr>

    <tr>
        <td>Ziah</td>
        <td>14</td>
        <td>9</td>
    </tr>

</table>

</body>
</html>
